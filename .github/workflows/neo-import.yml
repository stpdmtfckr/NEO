name: Import NEO files individually
on:
  push:
    branches:
      - neo-import-staging-20261018
    paths:
      - .github/workflows/neo-import.yml
permissions:
  contents: write
concurrency:
  group: neo-import-main
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import full NEO archive as one commit per file
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/neo-staging
          cp .neo-import/import-part-*.txt .neo-import/bin-import-part-*.txt /tmp/neo-staging/
          for attempt in 1 2 3 4 5; do
            echo "Import attempt ${attempt}"
            git fetch origin main
            git switch -C neo-import-output origin/main
            python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, io, hashlib, tarfile, subprocess
          root = Path('/tmp/neo-staging')
          bundles = [
              ('import-part-', 13, '2aa76655aa29df8e2502192933e2ace7e328ce3196adb0001daf59e6b5e04949', 1013),
              ('bin-import-part-', 9, '1af3f9c2a44e0dc44ad4d3f17a34cf679cd5ce070d84167f574ccce0d3c5ab7d', 16),
          ]
          added, skipped = 0, 0
          seen = set()
          for prefix, count, expected_hash, expected_count in bundles:
              parts = sorted(root.glob(prefix + '*.txt'))
              assert len(parts) == count, (prefix, len(parts))
              data = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
              digest = hashlib.sha256(data).hexdigest()
              assert digest == expected_hash, (prefix, digest)
              with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
                  entries = sorted((m for m in archive if m.isfile()), key=lambda m: m.name)
                  assert len(entries) == expected_count, (prefix, len(entries))
                  for item in entries:
                      name = item.name
                      path = PurePosixPath(name)
                      assert not path.is_absolute() and '..' not in path.parts
                      assert not any(p in ('.git', '.github', '.neo-import') for p in path.parts)
                      assert name not in seen, name
                      seen.add(name)
                      target = Path(name)
                      data = archive.extractfile(item).read()
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if target.is_file() and target.read_bytes() == data:
                          skipped += 1
                          continue
                      target.write_bytes(data)
                      subprocess.run(['git', 'add', '--', name], check=True)
                      subprocess.run(['git', '-c', 'user.name=neo-import[bot]',
                         '-c', 'user.email=41898282+github-actions[bot]@users.noreply.github.com',
                         'commit', '-q', '-m', 'Add ' + name], check=True)
                      added += 1
          assert len(seen) == 1029, len(seen)
          print(f'NEO import: {added} individual commits, {skipped} unchanged files')
          PY
            if git push origin HEAD:main; then
              echo 'NEO full import pushed successfully'
              exit 0
            fi
            echo 'Concurrent update detected, rebuilding from latest main'
          done
          echo 'Failed to push after 5 attempts'
          exit 1
